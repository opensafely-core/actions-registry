name: Update Python dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update-python-dependencies:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opensafely-core/setup-action@d9171097dd0d37bdb7bed58f701eb03ff317ed17 # v1.7.0
        with:
          python-version: "3.10"
          install-just: true
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: 1031449
          private-key: ${{ secrets.CREATE_PR_APP_PRIVATE_KEY }}
      - uses: bennettoxford/update-dependencies-action@b77a22bcfe1d06020d908e64c9828fe944da3a5e # v1
        with:
          pr_label: "dependencies,python"
          token: ${{ steps.generate-token.outputs.token }}
          update_command: "just update-dependencies"
